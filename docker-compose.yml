version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data/jobs:/app/data/jobs
    depends_on:
      - redis
      - minio

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - ./data/jobs:/app/data/jobs
    depends_on:
      - redis
      - api

volumes:
  redis-data:
  minio-data:
